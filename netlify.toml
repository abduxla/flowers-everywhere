# Netlify configuration for Flowers Everywhere (static site)
[build]
  publish = "."

# The site's JS/CSS and — critically — data.js (the catalogue "database")
# all live under /assets with STABLE filenames, so they must NOT be cached
# immutably: returning visitors would never receive catalogue/price updates
# or code changes. must-revalidate lets the browser cache but always check
# for a newer version (cheap 304s when unchanged).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
