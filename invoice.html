<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice · Flowers Everywhere</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1A1A1A; --muted:#78786e; --line:#e5e2dc; --accent:#c08a72; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Jost',sans-serif; color:var(--ink); background:#f2f0ec; padding:24px; }
    .sheet { max-width:720px; margin:0 auto; background:#fff; border:1px solid var(--line); border-radius:14px; padding:40px; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; border-bottom:1px solid var(--line); padding-bottom:22px; margin-bottom:22px; }
    .brand { font-family:'Cormorant Garamond',serif; font-size:1.9rem; font-weight:600; }
    .brand small { display:block; font-family:'Jost',sans-serif; font-size:.6rem; letter-spacing:.28em; text-transform:uppercase; color:var(--accent); margin-top:2px; }
    .meta { text-align:right; font-size:.82rem; color:var(--muted); line-height:1.7; }
    .meta b { color:var(--ink); }
    h1.doc { font-family:'Cormorant Garamond',serif; font-weight:600; font-size:1.5rem; margin:0 0 18px; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th { text-align:left; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line); padding:10px 8px; }
    td { padding:12px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    td.r, th.r { text-align:right; }
    .totals { margin-top:18px; margin-left:auto; width:280px; font-size:.92rem; }
    .totals .row { display:flex; justify-content:space-between; padding:6px 8px; }
    .totals .grand { font-weight:700; font-size:1.05rem; border-top:2px solid var(--ink); margin-top:6px; padding-top:12px; }
    .note { margin-top:26px; font-size:.82rem; color:var(--muted); line-height:1.6; }
    .foot { margin-top:26px; padding-top:18px; border-top:1px solid var(--line); font-size:.8rem; color:var(--muted); text-align:center; }
    .bar { max-width:720px; margin:0 auto 16px; display:flex; gap:10px; justify-content:flex-end; }
    .btn { font-family:'Jost',sans-serif; font-size:.86rem; font-weight:600; padding:11px 20px; border-radius:999px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; text-decoration:none; }
    .btn--ghost { background:transparent; color:var(--ink); }
    .empty { max-width:720px; margin:60px auto; text-align:center; color:var(--muted); }
    @media print {
      body { background:#fff; padding:0; }
      .sheet { border:none; border-radius:0; max-width:none; padding:0; }
      .bar { display:none; }
      @page { margin:16mm; }
    }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <a class="btn btn--ghost" href="index.html">← Store</a>
    <button class="btn" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var money = function (n) { return "Rs. " + Number(n || 0).toLocaleString("en-LK"); };
    var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); };
    var WA = '<svg viewBox="0 0 24 24" width="14" height="14" fill="#25D366" style="flex:none" aria-label="WhatsApp"><path d="M17.5 14.4c-.3-.15-1.7-.85-2-.95-.26-.1-.45-.15-.64.15s-.74.94-.9 1.13c-.17.2-.33.22-.62.08a8.2 8.2 0 0 1-2.4-1.48 9 9 0 0 1-1.66-2.07c-.17-.3 0-.46.13-.6.13-.14.29-.33.43-.5.14-.17.19-.29.29-.48.1-.2.05-.36-.02-.5-.08-.15-.64-1.54-.88-2.11-.23-.55-.47-.48-.64-.49h-.55c-.19 0-.5.07-.76.36-.26.29-1 .98-1 2.38s1.02 2.76 1.17 2.95c.14.2 2 3.05 4.85 4.28.68.29 1.2.47 1.62.6.68.22 1.3.19 1.79.11.55-.08 1.7-.69 1.93-1.36.24-.67.24-1.24.17-1.36-.07-.12-.26-.19-.55-.34zM12 2a10 10 0 0 0-8.6 15.06L2 22l5.05-1.32A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3 .78.8-2.92-.2-.31A8.2 8.2 0 1 1 12 20.2z"/></svg>';
    var SB = null;
    try { SB = window.supabase.createClient("https://eqcjvaspagwmiezqmgiy.supabase.co", "sb_publishable_OiQz4PO-EoRZFnPbZAxeHw_nEhZaaPe"); } catch (e) {}

    function decodeInline(h) {
      try { return JSON.parse(decodeURIComponent(escape(atob(h)))); } catch (e) { return null; }
    }
    // The link carries either a short code (…#Ab3xK9 → look it up in Supabase)
    // or, for older links, the whole order encoded inline.
    async function loadOrder() {
      var h = location.hash.replace(/^#/, "");
      if (!h) return null;
      if (/^[A-Za-z0-9]{6,14}$/.test(h) && SB) {
        try {
          var res = await SB.from("orders").select("data").eq("id", h).single();
          if (res && res.data && res.data.data) return res.data.data;
        } catch (e) {}
      }
      return decodeInline(h);
    }
    function render(o) {
      var root = document.getElementById("root");
      if (!o || !o.items || !o.items.length) {
        document.getElementById("bar").style.display = "none";
        root.innerHTML = '<div class="empty"><h2>Invoice not found</h2><p>This link is missing its order details. Open it from the WhatsApp order message.</p></div>';
        return;
      }
      var d = o.date ? new Date(o.date) : new Date();
      var rows = o.items.map(function (it, i) {
        var thumb = it.image ? '<img src="' + esc(it.image) + '" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:6px;flex:none;border:1px solid var(--line)">' : '';
        return '<tr><td>' + (i + 1) + '</td>' +
          '<td><div style="display:flex;align-items:center;gap:10px">' + thumb +
            '<div><b>' + esc(it.name) + '</b><br><span style="color:var(--muted);font-size:.78rem">' + esc(it.id || "") + (it.color ? ' · ' + esc(it.color) : '') + '</span></div>' +
          '</div></td>' +
          '<td class="r">' + it.qty + '</td><td class="r">' + money(it.unit) + '</td><td class="r">' + money(it.total) + '</td></tr>';
      }).join("");
      root.innerHTML =
        '<div class="sheet">' +
          '<div class="top">' +
            '<div class="brand"><img src="assets/img/logo.png" alt="Flowers Everywhere" style="height:56px;display:block"></div>' +
            '<div class="meta"><div>Invoice <b>' + esc(o.ref || "") + '</b></div>' +
              '<div>' + d.toLocaleDateString("en-LK", { year: "numeric", month: "short", day: "numeric" }) + '</div>' +
              '<div style="display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:2px">' + WA +
                '<a href="https://wa.me/94705254433" style="color:inherit;text-decoration:none">+94 70 5254433</a></div></div>' +
          '</div>' +
          '<h1 class="doc">Order Invoice</h1>' +
          '<table><thead><tr><th>#</th><th>Product</th><th class="r">Qty</th><th class="r">Unit</th><th class="r">Amount</th></tr></thead>' +
            '<tbody>' + rows + '</tbody></table>' +
          '<div class="totals">' +
            '<div class="row"><span>Total items</span><span>' + (o.totalItems || o.items.reduce(function (s, it) { return s + it.qty; }, 0)) + '</span></div>' +
            '<div class="row grand"><span>Grand Total</span><span>' + money(o.grandTotal) + '</span></div>' +
          '</div>' +
          '<p class="note">Free island-wide delivery on orders over Rs. 15,000. Please confirm availability and delivery/pickup with the customer.</p>' +
          '<div class="foot">Flowers Everywhere · Order placed via flowerseverywhere.lk</div>' +
        '</div>';
      document.title = "Invoice " + (o.ref || "") + " · Flowers Everywhere";
    }
    document.getElementById("root").innerHTML = '<div class="empty"><p>Loading invoice…</p></div>';
    loadOrder().then(render).catch(function () { render(null); });
  </script>
</body>
</html>
